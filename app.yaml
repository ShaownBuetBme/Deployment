name: deployment-api
services:
  - name: api
    github: 
      repo: shaownbuetbme/Deployment
      branch: main
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app -host 0.0.0.0 -port 8000
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
    http_port: 8000
    health_check:
      http_path: /health
    autoscaling:
      max_instance_count: 3
      min_instance_count: 1
    instance_size_slug: basic-xs
databases:
  - name: postgres-db
    engine: POSTGRESQL
    version: "15"
    size: db-s-1vcpu-1gb
    region: nyc3
